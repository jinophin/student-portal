body {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 40px 20px;

    justify-content: center;
    align-items: center;

    background-repeat:no-repeat;
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:#00f0ff;
    text-shadow:2px 2px 8px #000000,0 0 10px #00a2ff;

}

/* Turns the unstyled page into a centered, elegant card container */
html, body {
    text-align: center;
}

/* Targeting your main wrapper or body flow */
body > h1#heading {
    color:#oof0ff;
    font-size: 26px;
    margin-bottom: 24px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Style for all text, file, and password input fields */
input[type="text"],
input[type="email"],
input[type="number"],
input[type="password"],
select {
    width: 100%;
    max-width: 400px;
    padding: 12px 16px;
    margin: 10px 0;
    display: inline-block;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 15px;
    background-color: #ffffff;
    transition: all 0.3s ease;
}

input:focus, select:focus {
    outline: none;
    border-color: #3498db;
    box-shadow: 0 0 8px rgba(52, 152, 219, 0.2);
}

/* Style for your file input layout */
input[type="file"] {
    margin: 12px 0;
    font-size: 14px;
}

/* Target your round image preview container */
.container {
    margin: 15px auto;
    display: flex;
    justify-content: center;
}

img#preview {
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    border: 3px solid #fff;
}

/* Labels, Gender headers (<B> tags with specific IDs) */
b#g, b#w, b {
    display: inline-block;
    margin-top: 15px;
    margin-bottom: 5px;
    color: #oof0ff;
    font-size: 15px;
}

/* Radio buttons and Checkboxes layout alignment */
input[type="radio"], 
input[type="checkbox"] {
    margin: 0 6px 0 12px;
    transform: scale(1.1);
    vertical-align: middle;
}

label {
    font-size: 15px;
    color: #oof0ff;
    vertical-align: middle;
    cursor: pointer;
}

/* Clean divider line style replacing basic <hr> */
hr {
    border: 0;
    height: 1px;
    background: #dcdde1;
    margin: 20px auto;
    max-width: 400px;
}

/* Transforming your standard button into a professional interactive element */
button {
    background-color: #3498db;
    color: white;
    padding: 14px 20px;
    margin: 25px 0 15px 0;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    max-width: 400px;
    font-size: 16px;
    font-weight: bold;
    text-transform: uppercase;
    transition: background-color 0.3s ease, transform 0.1s ease;
    box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);
}

button:hover {
    background-color: #2980b9;
}

button:active {
    transform: scale(0.99);
}

/* Clean link formatting for "Already Have An Account" */
a {
    display: block;
    color:#oof0ff;
    text-decoration: none;
    font-size: 14px;
    margin-top: 10px;
    transition: color 0.2s;
}

a:hover {
    color: #1abc9c;
    text-decoration: underline;
}

/* Response output text style */
#output {
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
    color: #27ae60;
}

            }

        function image(){
            const profile=document.getElementById("profile");
            const preview=document.getElementById("preview");
            profile.addEventListener("change",function(){
            const file=this.files[0];
            if(file){
                preview.src=URL.createObjectURL(file);
