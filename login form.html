<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <title>Student Login Portal with OTP</title>
    
    <!-- 1. Include Firebase Core, Firestore, & Auth SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- 2. Clean Modern CSS Layout Styles -->
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-sizing: border-box;
        }

        h1, h2 {
            margin-bottom: 24px;
            color: #333333;
            font-size: 22px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            font-size: 14px;
            background-color: #f9f9f9;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background-color: #005a9e;
        }

        .sub-text {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Invisible reCAPTCHA container for Firebase Phone Auth -->
    <div id="recaptcha-container"></div>

    <!-- Step 1: Login Credentials Section -->
    <div id="loginSection" class="card">
        <h1>STUDENT-LOGIN PORTAL</h1>
        <input type="text" id="loginName" placeholder="Enter Full Name"><br>
        <input type="password" id="loginPassword" placeholder="Enter Password"><br>
        <button onclick="loginStudent()">LOGIN</button>
    </div>

    <!-- Step 2: OTP Verification Section (Hidden initially) -->
    <div id="otpSection" class="card" style="display: none;">
        <h1>VERIFY OTP</h1>
        <p class="sub-text">An OTP has been sent to your registered phone number ending in <strong id="phoneMask">****</strong>.</p>
        <input type="text" id="otpCode" placeholder="Enter 6-digit OTP"><br>
        <button onclick="verifyOTP()">VERIFY & ENTER</button>
    </div>

    <!-- Step 3: Student Profile Section -->
    <div id="profileSection" class="card" style="display: none;">
        <img id="studentPhoto" width="150" height="150" style="border-radius: 50%; border: 3px solid #0078d4; object-fit: cover; background-color: #e1dfdd;" alt="Profile picture"><br><br>
        <h2 id="welcomeMessage">Welcome back!</h2>
        <div style="text-align: left; display: inline-block;">
            <p><strong>Course:</strong> <span id="displayCourse"></span></p>
            <p><strong>Timestamp:</strong> <span id="displayTimestamp"></span></p>
        </div>
        <br><br>
        <button onclick="logoutStudent()" style="background-color: #d83b01;">Logout</button>
    </div>

    <!-- 4. Functional Scripts -->
    <script>
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCRrDSkkrZmvkrD5qB8lh0VUtTJvo-JBQA",
  authDomain: "student-addmission-portal.firebaseapp.com",
  projectId: "student-addmission-portal",
  storageBucket: "student-addmission-portal.firebasestorage.app",
  messagingSenderId: "504732202224",
  appId: "1:504732202224:web:6059d78c71600c4ac77e35",
  measurementId: "G-HLLBP2FT7M"
};

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        var db = firebase.firestore();
        var auth = firebase.auth();

        // Global variable to store active student data between OTP steps
        var currentStudentData = null;

        // Initialize invisible reCAPTCHA on load
        window.onload = function() {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                'size': 'invisible'
            });
        };

        function loginStudent() {
            const nameInput = document.getElementById("loginName").value.trim();
            const passwordInput = document.getElementById("loginPassword").value;

            if (nameInput === "" || passwordInput === "") {
                alert("Please fill in both fields.");
                return;
            }

            db.collection("student_details")
              .where("name", "==", nameInput)
              .where("password", "==", passwordInput)
              .get()
              .then((querySnapshot) => {
                  if (!querySnapshot.empty) {
                      const studentDoc = querySnapshot.docs[0];
                      currentStudentData = studentDoc.data();

                      // Grab phone number from the database record (field 'ph' or 'phone')
                      let phone = currentStudentData.ph || currentStudentData.phone;

                      if (!phone) {
                          alert("No phone number associated with this student account.");
                          return;
                      }

                      // Ensure country code is attached (e.g. +91 for India)
                      if (!phone.startsWith("+")) {
                          phone = "+91" + phone;
                      }

                      // Trigger OTP sending
                      sendOTP(phone);

                  } else {
                      alert("Invalid Name or Password.");
                  }
              })
              .catch((error) => {
                  console.error("Error accessing database: ", error);
                  alert("Error connecting to database.");
              });
        }

        function sendOTP(phoneNumber) {
            const appVerifier = window.recaptchaVerifier;

            auth.signInWithPhoneNumber(phoneNumber, appVerifier)
                .then((confirmationResult) => {
                    window.confirmationResult = confirmationResult;

                    // Mask the phone number for display (e.g., ****2533)
                    const lastDigits = phoneNumber.slice(-4);
                    document.getElementById("phoneMask").innerText = "******" + lastDigits;

                    // Transition UI to OTP View
                    document.getElementById("loginSection").style.display = "none";
                    document.getElementById("otpSection").style.display = "block";
                })
                .catch((error) => {
                    console.error("OTP Send Error: ", error);
                    alert("Failed to send OTP: " + error.message);
                });
        }

        function verifyOTP() {
            const otpCode = document.getElementById("otpCode").value.trim();

            if (otpCode === "") {
                alert("Please enter the 6-digit OTP.");
                return;
            }

            window.confirmationResult.confirm(otpCode)
                .then((result) => {
                    // OTP Verification successful -> Render Profile
                    document.getElementById("otpSection").style.display = "none";
                    
                    document.getElementById("welcomeMessage").innerText = "Welcome back, " + currentStudentData.name + "!";
                    document.getElementById("displayCourse").innerText = currentStudentData.course || "Not Assigned";
                    
                    if (currentStudentData.timestamp) {
                        document.getElementById("displayTimestamp").innerText = currentStudentData.timestamp.toDate().toLocaleString();
                    } else {
                        document.getElementById("displayTimestamp").innerText = "N/A";
                    }

                    // Profile Image Logic
                    let photoSrc = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230078d4'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";

                    if (currentStudentData.profile && currentStudentData.profile !== "profile.png" && currentStudentData.profile.trim() !== "") {
                        photoSrc = currentStudentData.profile;
                    } else if (currentStudentData.image && currentStudentData.image.trim() !== "") {
                        photoSrc = currentStudentData.image;
                    }

                    document.getElementById("studentPhoto").src = photoSrc;
                    document.getElementById("profileSection").style.display = "block";
                })
                .catch((error) => {
                    console.error("Invalid OTP: ", error);
                    alert("Invalid OTP code. Please try again.");
                });
        }

        function logoutStudent() {
            document.getElementById("loginName").value = "";
            document.getElementById("loginPassword").value = "";
            document.getElementById("otpCode").value = "";
            document.getElementById("profileSection").style.display = "none";
            document.getElementById("otpSection").style.display = "none";
            document.getElementById("loginSection").style.display = "block";
        }
    </script>
</body>
</html>
